function redeem(p){if(state.points<p)alert('คะแนนไม่เพียงพอ');else if(confirm('ยืนยันแลกคะแนนจำลอง '+p+' P?')){state.points-=p;render();alert('แลกสิทธิ์ตัวอย่างสำเร็จ!')}}
function startQuiz(){state.quiz=0;state.selected=-1;go('Quiz')}
function quiz(){let q=questions[state.quiz];return `${btn('× ปิด',"go('Home')",'back')}<h2>Investment Quiz</h2><div class="progress"><span style="width:${(state.quiz+1)/questions.length*100}%"></span></div><p class="muted" style="margin-top:10px">ข้อ ${state.quiz+1} / ${questions.length}</p><div class="card pink" style="margin-top:22px;padding:22px"><span class="chip">Beginner</span><h2>${q.q}</h2><div style="text-align:center;font-size:60px">🐱📈</div></div>${q.a.map((a,i)=>btn(`${i===state.selected?'🔴':'◯'} ${a}`,`state.selected=${i};render()`,`quizchoice ${i===state.selected?'selected':''}`)).join('')}<div style="margin-top:20px">${btn('ถัดไป →',"nextQuiz()",'btn')}</div>`}

function quizDone(){return `<div style="text-align:center;padding:45px 10px"><div style="font-size:90px">🐱🏆</div><h1>ทำ Quiz สำเร็จ!</h1><p>รับคะแนนสะสมเพิ่ม</p><h1 style="color:#ee244c">+10 P</h1><p>🔥 ทำต่อเนื่อง ${state.streak} วัน</p><br>${btn('กลับหน้าหลัก',"go('Home')",'btn')}</div>`}
function showStock(t){alert(t+'\\nข้อมูลราคาและกราฟเป็นข้อมูลตัวอย่างสำหรับ Prototype')}

for(const [name,l] of [['Home',0],['Explore',25],['Cash',50],['Portfolio',75]])hits+=refHit('ไปหน้า '+name,90,l,25,8,`closeRef();go('${name}')`);

function referenceDialog(){let t=referenceModal,body='';
if(t==='FX')body=`<h2>⇄ แปลงสกุลเงิน</h2><div class="ref-box"><p>จาก ${state.from}</p><input type="number" id="fxvalue" value="${state.amount}" style="width:100%;padding:12px;border:1px solid #f4bdca;border-radius:12px;font:700 19px Prompt" oninput="state.amount=Number(this.value);document.getElementById('fxresult').textContent=(state.from==='THB'?state.amount/35.1:state.amount*35.1).toLocaleString('en-US',{maximumFractionDigits:2})"><p style="margin-top:12px">เป็น ${state.from==='THB'?'USD':'THB'}</p><h2 id="fxresult">${(state.from==='THB'?state.amount/35.1:state.amount*35.1).toLocaleString('en-US',{maximumFractionDigits:2})}</h2></div><button class="pill" onclick="state.from=state.from==='THB'?'USD':'THB';render()">⇅ สลับสกุลเงิน</button><p class="muted" style="margin:15px 0">อัตราจำลอง 1 USD = 35.10 THB</p><button class="btn" onclick="alert('การแลกเงินเป็นการจำลอง ไม่มีธุรกรรมจริง')">แปลงสกุลเงิน</button>`;

else if(t==='Period')body='<h2>ผลตอบแทนตามช่วงเวลา</h2><p>ตัวเลือก 1D, 1W, 1M, 3M, 1Y และ All เป็นส่วนหนึ่งของตัวอย่าง UI โดยกราฟอ้างอิงเป็นข้อมูลจำลอง</p>';

else body=`<h2>${{Deposit:'ฝากเงิน',Withdraw:'ถอนเงิน',History:'ประวัติธุรกรรม'}[t]||t}</h2><p>ฟีเจอร์นี้เป็นการสาธิต ไม่มีการเชื่อมต่อบัญชีหรือทำธุรกรรมจริง</p>`;
return `<div class="reference-dialog"><button class="close" aria-label="ปิด" onclick="closeRef()">×</button>${body}</div>`}
